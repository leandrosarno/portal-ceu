<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEU CAMINHO DO MAR</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        // =========================================================================
        // 🔗 PONTE DE CONEXÃO COM A API DO GOOGLE APPS SCRIPT
        // =========================================================================
        const API_URL = 'https://script.google.com/macros/s/AKfycbwib78hd41QOPPOXt4CHtGbqiEcF4ICDqAfXsMzSg8gRVyJ1vnA74vBkPjgioBz1bDn/exec';
    </script>

    <style>
        :root, [data-theme="dark"] {
            --bg-primary: #0b0f19; --bg-secondary: #111827; --bg-card: rgba(30, 41, 59, 0.6); 
            --bg-card-hover: rgba(51, 65, 85, 0.7); --bg-glass: rgba(15, 23, 42, 0.75); 
            --border-color: rgba(255, 255, 255, 0.08); --text-primary: #f8fafc; 
            --text-secondary: #94a3b8; --text-muted: #64748b; --accent-primary: #6366f1; 
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #3b82f6 50%, #06b6d4 100%);
            --success-color: #10b981; --warning-color: #f59e0b; --danger-color: #ef4444; 
            --radius-md: 12px; --radius-xl: 24px; --font-sans: 'Inter', sans-serif; --font-heading: 'Outfit', sans-serif;
        }
        [data-theme="light"] {
            --bg-primary: #f8fafc; --bg-secondary: #f1f5f9; --bg-card: rgba(255, 255, 255, 0.85); 
            --bg-card-hover: rgba(255, 255, 255, 1); --bg-glass: rgba(255, 255, 255, 0.8); 
            --border-color: rgba(0, 0, 0, 0.08); --text-primary: #0f172a; --text-secondary: #475569;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-sans); background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; transition: background 0.3s; }
        h1, h2, h3 { font-family: var(--font-heading); color: var(--text-primary); }
        button, input, select { font-family: inherit; outline: none; border: none; background: none; }
        button { cursor: pointer; }

        .bg-mesh { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; }
        .glow-orb { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.25; }
        .orb-1 { top: -10%; left: 15%; width: 50vw; height: 50vw; background: radial-gradient(circle, var(--accent-primary) 0%, transparent 70%); }
        .orb-2 { bottom: -15%; right: -10%; width: 45vw; height: 45vw; background: radial-gradient(circle, #3b82f6 0%, transparent 70%); }

        .navbar { position: sticky; top: 0; z-index: 50; background: var(--bg-glass); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border-color); }
        .nav-container { max-width: 1280px; margin: 0 auto; padding: 0.85rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        .nav-brand { display: flex; align-items: center; gap: 0.75rem; }
        .brand-icon { width: 42px; height: 42px; border-radius: var(--radius-md); background: var(--accent-gradient); display: flex; align-items: center; justify-content: center; color: white; font-size: 1.5rem; overflow: hidden;}
        .brand-title { font-family: var(--font-heading); font-weight: 800; font-size: 1.15rem; }
        .brand-subtitle { font-size: 0.75rem; font-weight: 500; color: var(--text-secondary); text-transform: uppercase; }
        .btn-icon { display: flex; align-items: center; justify-content: center; padding: 0.5rem; border-radius: 50%; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: var(--text-secondary); font-size: 1.2rem; transition: 0.2s; }
        .btn-icon:hover { background: rgba(255,255,255,0.1); color: var(--text-primary); }

        .search-filter-container { max-width: 1280px; margin: 2rem auto; padding: 0 1.5rem; display: flex; flex-direction: row; flex-wrap: wrap; align-items: stretch; gap: 1.5rem; width: 100%;}
        
        .search-box { position: relative; display: flex; align-items: center; width: 100%;}
        .search-box i { position: absolute; left: 1rem; color: var(--text-muted); font-size: 1.2rem; }
        #search-input { width: 100%; padding: 1rem 1rem 1rem 3rem; border-radius: var(--radius-md); border: 1px solid var(--border-color); background: var(--bg-secondary); color: var(--text-primary); font-size: 1rem; }
        #search-input:focus { border-color: var(--accent-primary); box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15); }
        
        .filter-pills { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .filter-pill { padding: 0.4rem 0.95rem; border-radius: 99px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); color: var(--text-secondary); font-size: 0.85rem; font-weight: 500; transition: 0.2s; }
        .filter-pill.active { background: var(--accent-gradient); color: white; border-color: transparent; }

        .results-bar { max-width: 1280px; margin: 0 auto; padding: 0 1.5rem 1rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); width: 100%;}
        .sort-select { padding: 0.6rem; border-radius: var(--radius-md); background: var(--bg-secondary); border: 1px solid var(--border-color); color: var(--text-primary); font-weight: 600; width: 100%; max-width: 250px;}

        .activities-grid { max-width: 1280px; margin: 2rem auto; padding: 0 1.5rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.5rem; width: 100%;}
        .activity-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-xl); padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; position: relative; overflow: hidden; transition: transform 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .activity-card:hover { transform: translateY(-5px); background: var(--bg-card-hover); border-color: var(--border-highlight); }
        .activity-card::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--accent-gradient); }
        .activity-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.25rem;}
        
        .activity-category { display: inline-block; font-size: 0.7rem; padding: 0.2rem 0.6rem; border-radius: 4px; text-transform: uppercase; font-weight: bold; }
        
        .detail-badge { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.35rem 0.75rem; border-radius: 99px; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border-color); font-size: 0.85rem; color: var(--text-primary); font-weight: 500; white-space: nowrap; transition: 0.2s; cursor: default; }
        .detail-badge i { color: var(--accent-primary); font-size: 1.15rem; }
        .detail-badge:hover { background: rgba(255, 255, 255, 0.08); border-color: var(--accent-primary); }
        
        .enroll-btn { width: 100%; padding: 0.75rem; border-radius: var(--radius-md); font-weight: bold; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 0.5rem;}
        .btn-open { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid #10b981; }
        .btn-open:hover { background: #10b981; color: white; }
        .btn-closed { background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid #f59e0b; }
        .btn-closed:hover { background: #f59e0b; color: white; }

        .modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 1rem; }
        .modal.active { display: flex; }
        .modal-box { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-xl); padding: 2rem; width: 100%; max-width: 450px; position: relative; }
        .modal-close { position: absolute; top: 1rem; right: 1rem; background: none; border: none; color: var(--text-secondary); font-size: 1.5rem; cursor: pointer; }
        .form-input { width: 100%; padding: 0.8rem; margin-bottom: 1rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary); }
        .btn-submit { background: var(--accent-gradient); color: white; padding: 0.8rem; border-radius: 8px; font-weight: bold; width: 100%; margin-top: 1rem;}

        @keyframes spin { 100% { transform: rotate(360deg); } }
        .loading { animation: spin 1s linear infinite; display: inline-block;}
        
        @media (max-width: 768px) {
            .search-filter-container { flex-direction: column; }
            .coluna-imagem { display: none !important; } 
            .coluna-direita { width: 100% !important; }
        }
    </style>
</head>
<body>
    <div class="bg-mesh"><div class="glow-orb orb-1"></div><div class="glow-orb orb-2"></div></div>

    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <div class="brand-icon" id="brand-logo"><i class="ri-graduation-cap-fill"></i></div>
                <div class="brand-text">
                    <span class="brand-title" id="brand-title"> </span>
                    <span class="brand-subtitle" id="brand-sub"> </span>
                </div>
            </div>
            <button class="btn-icon" onclick="toggleTheme()"><i class="ri-moon-line" id="theme-icon"></i></button>
        </div>
    </nav>

    <!-- O CABEÇALHO DIVIDIDO EM DUAS COLUNAS -->
    <div class="search-filter-container">
        
        <!-- Coluna Esquerda: A Imagem -->
        <div class="coluna-imagem" style="flex: 1; min-width: 250px; border-radius: var(--radius-xl); overflow: hidden; display: flex; justify-content: center; align-items: center; background: var(--bg-card); border: 1px solid var(--border-color); box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <img src="https://..." style="width: 100%; height: 100%; object-fit: cover;" id="img-destaque" alt="Destaque">
        </div>

        <!-- Coluna Direita: Buscas e Filtros -->
        <div class="coluna-direita" style="flex: 2; min-width: 300px; display: flex; flex-direction: column; justify-content: center; gap: 1rem; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-xl); padding: 1.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            
            <div style="display: flex; justify-content: flex-end;">
                <select id="sort-select" class="sort-select" onchange="filtrarCards()">
                    <option value="padrao">Ordenar por: Padrão do Sistema</option>
                    <option value="az">Ordenar por: Título (A-Z)</option>
                    <option value="prof">Ordenar por: Professor (A-Z)</option>
                </select>
            </div>

            <div class="search-box">
                <i class="ri-search-2-line"></i>
                <input type="text" id="search-input" placeholder="Buscar por modalidade, professor, local..." oninput="filtrarCards()">
            </div>
            
            <div class="filter-pills">
                <button class="filter-pill active" onclick="setDia('Todos', this)">Todos</button>
                <button class="filter-pill" onclick="setDia('Segunda', this)">Segunda</button>
                <button class="filter-pill" onclick="setDia('Terça', this)">Terça</button>
                <button class="filter-pill" onclick="setDia('Quarta', this)">Quarta</button>
                <button class="filter-pill" onclick="setDia('Quinta', this)">Quinta</button>
                <button class="filter-pill" onclick="setDia('Sexta', this)">Sexta</button>
                <button class="filter-pill" onclick="setDia('Sábado', this)">Sábado</button>
            </div>
        </div>
    </div>

    <div class="results-bar" style="border: none;">
        <div style="color: var(--text-secondary); font-weight: 600;" id="contador"><i class="ri-loader-4-line loading"></i> Lendo Banco de Dados...</div>
    </div>

    <main class="activities-grid" id="grid"></main>

    <!-- MODAL DE INTENÇÃO DE VAGAS -->
    <div class="modal" id="modal-fila">
        <div class="modal-box">
            <button class="modal-close" onclick="fecharModal()"><i class="ri-close-line"></i></button>
            <h2 style="margin-bottom: 0.5rem; color: var(--accent-primary);"><i class="ri-ticket-2-line"></i> Intenção de Vagas</h2>
            <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1.5rem;" id="modal-turma-nome">Turma X</p>
            
            <input type="hidden" id="fila-id-turma">
            
            <label style="font-size: 0.8rem; font-weight: bold; color: var(--text-secondary);">Nome do Munícipe</label>
            <input type="text" id="fila-nome" class="form-input" placeholder="Digite o nome completo" required>
            
            <div style="display: flex; gap: 1rem;">
                <div style="flex: 1;">
                    <label style="font-size: 0.8rem; font-weight: bold; color: var(--text-secondary);">Idade</label>
                    <input type="number" id="fila-idade" class="form-input" placeholder="Ex: 25" required>
                </div>
                <div style="flex: 2;">
                    <label style="font-size: 0.8rem; font-weight: bold; color: var(--text-secondary);">WhatsApp</label>
                    <input type="tel" id="fila-telefone" class="form-input" placeholder="(11) 99999-9999" required>
                </div>
            </div>
            
            <label style="font-size: 0.8rem; font-weight: bold; color: var(--text-secondary);">E-mail</label>
            <input type="email" id="fila-email" class="form-input" placeholder="seu.email@exemplo.com" required>
            
            <button class="btn-submit" id="btn-salvar-fila" onclick="enviarFilaEspera()">
                ENVIAR PEDIDO DE VAGA
            </button>
        </div>
    </div>

    <script>
        let turmasGlobais = [];
        let setupGlobal = {}; 
        let diaAtivo = 'Todos';

        document.addEventListener("DOMContentLoaded", () => {
            if(API_URL.includes('COLE_AQUI')) {
                Swal.fire('Atenção', 'Cole a URL da API na linha 17 do código!', 'error'); return;
            }
            buscarDadosDoGoogle();
        });

        function toggleTheme() {
            const html = document.documentElement; const icon = document.getElementById('theme-icon');
            const isDark = html.getAttribute('data-theme') === 'dark';
            html.setAttribute('data-theme', isDark ? 'light' : 'dark');
            icon.className = isDark ? 'ri-moon-line' : 'ri-sun-line';
        }

        function convertGoogleDriveUrl(url) {
            if (!url) return '';
            const match = url.trim().match(/(?:drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?id=|uc\?export=view&id=)|docs\.google\.com\/file\/d\/)([a-zA-Z0-9_-]{25,})/i);
            return match && match[1] ? `https://lh3.googleusercontent.com/d/${match[1]}` : url.trim();
        }

        // ⭐ MÁGICA DAS CORES INTELIGENTES
        function getCategoryColor(cat) {
            const str = cat.toLowerCase();
            if (/esporte|movimento|físic|ginástica|futebol|natação|luta/.test(str)) return { bg: 'rgba(16, 185, 129, 0.15)', text: '#10b981' }; 
            if (/cultura|arte|música|teatro|dança/.test(str)) return { bg: 'rgba(245, 158, 11, 0.15)', text: '#f59e0b' }; 
            if (/educação|pedagógic|ensino|aula|reforço/.test(str)) return { bg: 'rgba(59, 130, 246, 0.15)', text: '#3b82f6' }; 
            if (/tecnologia|maker|informática|robótica/.test(str)) return { bg: 'rgba(6, 182, 212, 0.15)', text: '#06b6d4' }; 
            if (/idioma|língua|inglês|espanhol/.test(str)) return { bg: 'rgba(236, 72, 153, 0.15)', text: '#ec4899' }; 
            if (/saúde|bem-estar|psicologia/.test(str)) return { bg: 'rgba(239, 68, 68, 0.15)', text: '#ef4444' }; 
            return { bg: 'rgba(99, 102, 241, 0.15)', text: '#818cf8' }; 
        }

        async function buscarDadosDoGoogle() {
            try {
                // ⭐ DESTRUIDOR DE CACHE: Garante que ele vai puxar sua alteração do Admin NA HORA!
                const antiCache = new Date().getTime();
                const response = await fetch(API_URL + '?action=getPublicData&nocache=' + antiCache);
                const data = await response.json();
                
                if (data.sucesso) processarDados(data.turmas, data.configuracoes);
                else Swal.fire('Erro', data.erro, 'error');
            } catch (err) {
                document.getElementById('contador').innerText = "Erro de Conexão.";
            }
        }

        function processarDados(matrizTurmas, configLinha1) {
            if (matrizTurmas.length <= 1) { document.getElementById('contador').innerText = "Nenhuma turma cadastrada."; return; }
            
            if(configLinha1 && configLinha1.length > 1) {
                try {
                    setupGlobal = JSON.parse(configLinha1[1] || '{}'); 
                    if(setupGlobal.centerName) document.getElementById('brand-title').innerText = setupGlobal.centerName;
                    if(setupGlobal.centerSubtitle) document.getElementById('brand-sub').innerText = setupGlobal.centerSubtitle;
                    if(setupGlobal.logoUrl) {
                        const logo = convertGoogleDriveUrl(setupGlobal.logoUrl);
                        document.getElementById('brand-logo').innerHTML = `<img src="${logo}" style="width:100%;height:100%;object-fit:cover;">`;
                    }
                    if(setupGlobal.featuredImage) {
                        const featImg = convertGoogleDriveUrl(setupGlobal.featuredImage);
                        document.getElementById('img-destaque').src = featImg;
                    }
                } catch(e){}
            }

            const headers = matrizTurmas[0].map(h => String(h).trim());
            turmasGlobais = matrizTurmas.slice(1).map((row, idx) => {
                let obj = { _originalIndex: idx };
                headers.forEach((h, i) => obj[h || `Col_${i}`] = row[i] || '');
                return obj;
            });
            filtrarCards();
        }

        function setDia(dia, btnElement) {
            document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active'); diaAtivo = dia; filtrarCards();
        }

        function filtrarCards() {
            const busca = document.getElementById('search-input').value.toLowerCase();
            const sort = document.getElementById('sort-select').value;
            const map = setupGlobal.columnMapping || {};
            
            const keys = Object.keys(turmasGlobais[0] || {}).filter(k => k !== '_originalIndex');
            const getColValue = (t, mappedCol, targetIdx, regex) => {
                if (mappedCol && mappedCol !== 'NENHUM_RODAPE_OCULTO' && t[mappedCol] !== undefined && String(t[mappedCol]).trim() !== '') return String(t[mappedCol]).trim();
                if (targetIdx !== undefined && keys[targetIdx] && t[keys[targetIdx]] !== undefined && String(t[keys[targetIdx]]).trim() !== '') return String(t[keys[targetIdx]]).trim();
                if (regex) { const f = keys.find(k => regex.test(k)); if (f && t[f] !== undefined && String(t[f]).trim() !== '') return String(t[f]).trim(); }
                return '';
            };

            let filtradas = turmasGlobais.filter(t => {
                const titulo = getColValue(t, map.titleColumn, 0, /turma|atividade|curso/i) || `Atividade ${t._originalIndex + 1}`;
                const idInterno = `turma_${t._originalIndex + 1}_${titulo.toLowerCase().replace(/[^a-z0-9]/g, '')}`;
                
                if (setupGlobal.hiddenIdsArray && setupGlobal.hiddenIdsArray.includes(idInterno)) return false;

                const values = Object.values(t).join(' ').toLowerCase();
                const matchBusca = busca === '' || values.includes(busca);
                
                let matchDia = true;
                if (diaAtivo !== 'Todos') {
                    const colDia = keys.find(k => /dia|semana|quando/i.test(k));
                    const valDias = (colDia && t[colDia] ? String(t[colDia]) : values).toLowerCase();
                    const diaLower = diaAtivo.toLowerCase();

                    if (diaLower === 'segunda') matchDia = /segunda|seg\b|2ª|2a/i.test(valDias);
                    else if (diaLower === 'terça') matchDia = /terça|terca|ter\b|3ª|3a/i.test(valDias);
                    else if (diaLower === 'quarta') matchDia = /quarta|qua\b|4ª|4a/i.test(valDias);
                    else if (diaLower === 'quinta') matchDia = /quinta|qui\b|5ª|5a/i.test(valDias);
                    else if (diaLower === 'sexta') matchDia = /sexta|sex\b|6ª|6a/i.test(valDias);
                    else if (diaLower === 'sábado') matchDia = /sábado|sabado|sab\b|sáb/i.test(valDias);
                    else if (diaLower === 'domingo') matchDia = /domingo|dom\b/i.test(valDias);
                }
                return matchBusca && matchDia;
            });

            if(sort === 'az') filtradas.sort((a,b) => String(getColValue(a, map.titleColumn, 0, /turma/i)).localeCompare(String(getColValue(b, map.titleColumn, 0, /turma/i))));
            if(sort === 'prof') filtradas.sort((a,b) => String(getColValue(a, map.teacherColumn, 5, /prof/i)).localeCompare(String(getColValue(b, map.teacherColumn, 5, /prof/i))));

            desenharTela(filtradas);
        }

        function getIcone(texto) {
            const lower = texto.toLowerCase();
            if(/hora|das|às|turno/i.test(lower)) return 'ri-time-line';
            if(/dia|semana|quando/i.test(lower)) return 'ri-calendar-check-line';
            if(/sala|local|quadra|polo/i.test(lower)) return 'ri-map-pin-2-line';
            if(/prof/i.test(lower)) return 'ri-user-star-line';
            if(/idade|público|alvo/i.test(lower)) return 'ri-group-line';
            if(/sufixo|id|código|turma/i.test(lower)) return 'ri-price-tag-3-line';
            if(/nível|fase|ano/i.test(lower)) return 'ri-bar-chart-grouped-line';
            return 'ri-bookmark-3-line'; 
        }

        function desenharTela(turmas) {
            const grid = document.getElementById('grid');
            document.getElementById('contador').innerText = `Exibindo ${turmas.length} turma(s)`;
            if (turmas.length === 0) { grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 3rem;">Nenhuma turma encontrada com esses filtros.</div>'; return; }

            const map = setupGlobal.columnMapping || {};
            const layout = map.columnLayoutMap || {};
            const visibleCols = map.visibleDetailsMap || {};
            const hasCustomMap = Object.keys(visibleCols).length > 0;
            
            const msgMatricula = (setupGlobal.instrucoesMatricula || 'Compareça à secretaria para realizar a matrícula.').replace(/'/g, "\\'");

            grid.innerHTML = turmas.map(t => {
                const keys = Object.keys(t).filter(k => k !== '_originalIndex');
                
                const getColValue = (mappedCol, targetIdx, regex) => {
                    if (mappedCol && mappedCol !== 'NENHUM_RODAPE_OCULTO' && t[mappedCol] !== undefined && String(t[mappedCol]).trim() !== '') return String(t[mappedCol]).trim();
                    if (targetIdx !== undefined && keys[targetIdx] && t[keys[targetIdx]] !== undefined && String(t[keys[targetIdx]]).trim() !== '') return String(t[keys[targetIdx]]).trim();
                    if (regex) { const f = keys.find(k => regex.test(k)); if (f && t[f] !== undefined && String(t[f]).trim() !== '') return String(t[f]).trim(); }
                    return '';
                };

                const titulo = getColValue(map.titleColumn, 0, /turma|atividade|curso/i) || `Atividade ${t._originalIndex + 1}`;
                const category = getColValue(map.categoryColumn, 4, /núcleo|centro/i) || 'Geral';
                const idInterno = `turma_${t._originalIndex + 1}_${titulo.toLowerCase().replace(/[^a-z0-9]/g, '')}`;
                
                let professor = ''; let profReal = '';
                if (map.teacherColumn !== 'NENHUM_RODAPE_OCULTO') {
                    if (map.teacherColumn && t[map.teacherColumn]) { professor = t[map.teacherColumn]; profReal = map.teacherColumn; } 
                    else { const pKey = keys.find(k => /prof|educador/i.test(k)) || keys[5]; if(pKey) { professor = t[pKey]; profReal = pKey; } }
                }

                const tituloRealDaColuna = map.titleColumn || keys.find(k => /turma|atividade|curso/i.test(k)) || keys[0];

                let linhas = {};
                keys.forEach((colName, i) => {
                    if(colName === tituloRealDaColuna || colName === map.categoryColumn || colName === profReal) return;
                    let isVis = hasCustomMap ? visibleCols[colName] : (/horário|hora|dia|semana|sala|local/i.test(colName));
                    if(isVis && t[colName] && t[colName].trim() !== '') {
                        let nL = layout[colName] || (i + 1);
                        if(!linhas[nL]) linhas[nL] = [];
                        linhas[nL].push({ nome: colName, valor: t[colName], icone: getIcone(colName) });
                    }
                });

                let sortedLineNumbers = Object.keys(linhas).map(Number).sort((a,b)=>a-b);
                let detalhesHtml = '';
                sortedLineNumbers.forEach(num => {
                    detalhesHtml += `<div style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.5rem;">`;
                    linhas[num].forEach(item => {
                        detalhesHtml += `<div class="detail-badge" title="${item.nome}"><i class="${item.icone}"></i><span>${item.valor}</span></div>`;
                    });
                    detalhesHtml += `</div>`;
                });

                // ⭐ A CORREÇÃO FINAL: Força a abertura se o Admin mandou!
                let isFila = false;
                if (setupGlobal.enrollmentClosedIdsArray && setupGlobal.enrollmentClosedIdsArray.includes(idInterno)) {
                    isFila = true; // O Admin mandou fechar!
                } else if (setupGlobal.enrollmentOpenIdsArray && setupGlobal.enrollmentOpenIdsArray.includes(idInterno)) {
                    isFila = false; // O Admin mandou abrir! (Ignora a planilha nativa)
                } else {
                    // Se o Admin nunca tocou no botão, olha a planilha nativa!
                    const vagasTxt = String(t['VAGAS'] || t['Status'] || t[keys[6]] || '');
                    if (/esgotad|lotad|lista|fila/i.test(vagasTxt)) isFila = true;
                }

                const botaoAcao = isFila 
                    ? `<button class="enroll-btn btn-closed" onclick="abrirFila('${idInterno}', '${titulo.replace(/'/g,"\\'")}')"><i class="ri-ticket-2-line"></i> Entrar na Fila de Espera</button>`
                    : `<button class="enroll-btn btn-open" onclick="Swal.fire('Matrículas Abertas!', '${msgMatricula}', 'info')"><i class="ri-check-double-line"></i> Informações de Matrícula</button>`;

                const corTag = getCategoryColor(category);

                return `
                <div class="activity-card">
                    <span class="activity-category" style="background: ${corTag.bg}; color: ${corTag.text};">${category}</span>
                    <h3 class="activity-title">${titulo}</h3>
                    ${professor ? `<div style="font-size:0.85rem; color:var(--text-muted); margin-bottom:1rem;"><i class="ri-user-star-line"></i> ${professor}</div>` : ''}
                    <div style="border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); padding: 1rem 0; margin-bottom: 1rem;">${detalhesHtml}</div>
                    ${botaoAcao}
                </div>`;
            }).join('');
        }

        function abrirFila(idTurma, titulo) {
            document.getElementById('fila-id-turma').value = idTurma;
            document.getElementById('modal-turma-nome').innerText = "Vaga desejada: " + titulo;
            document.getElementById('modal-fila').classList.add('active');
        }

        function fecharModal() {
            document.getElementById('modal-fila').classList.remove('active');
            document.getElementById('fila-nome').value = '';
            document.getElementById('fila-telefone').value = '';
            document.getElementById('fila-email').value = '';
            document.getElementById('fila-idade').value = '';
        }

        async function enviarFilaEspera() {
            const nome = document.getElementById('fila-nome').value;
            const telefone = document.getElementById('fila-telefone').value;
            const email = document.getElementById('fila-email').value;
            const idade = document.getElementById('fila-idade').value;
            const turma = document.getElementById('modal-turma-nome').innerText;

            if(!nome || !telefone || !email || !idade) return Swal.fire('Atenção', 'Preencha todos os campos do formulário.', 'warning');

            const btn = document.getElementById('btn-salvar-fila');
            btn.innerHTML = '<i class="ri-loader-4-line loading"></i> Gerando Ticket...';
            btn.disabled = true;

            const payload = { action: 'entrarFilaEspera', idTurma: document.getElementById('fila-id-turma').value, modalidade: turma, nomeAluno: nome, telefone: telefone, email: email, idade: idade };

            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
                const data = await res.json();
                
                if(data.sucesso) {
                    Swal.fire({ 
                        title: 'Tudo Certo!', 
                        html: `Sua intenção de vaga foi registrada e enviamos um e-mail de confirmação.<br><br>Sua posição na fila é:<br><b style="font-size:2rem; color:#6366f1;">${data.posicao}º Lugar</b>`, 
                        icon: 'success' 
                    }).then(() => fecharModal());
                } else Swal.fire('Erro', data.erro, 'error');
            } catch (err) {
                Swal.fire('Erro', 'Falha ao comunicar com a secretaria.', 'error');
            } finally {
                btn.innerHTML = 'ENVIAR PEDIDO DE VAGA';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
